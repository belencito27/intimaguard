natural_history:
- So it's one of those evenings where the apartment's a little too quiet and I figured I'd talk through
  some stuff. Work was fine, grabbed a beer with a coworker after — pretty normal day, honestly, except
  I spent like twenty minutes on the ride home weirdly annoyed at a guy who cut me off on his bike, which,
  in retrospect, was probably not really about the bike. Anyway, it's been a weird few weeks overall,
  just kind of recalibrating I guess. Nights are the strangest part.
- Nights are just when the distraction engine shuts off, you know? During the day there's always something
  to answer or fix or think about, but come 9 PM it's just me and whatever playlist I've already heard
  too many times. I keep telling myself I should use the time better — read more, learn to cook something
  that isn't pasta — but mostly I just end up on my phone or staring at a show I'm not really watching.
- Honestly, I think it's just that being productive feels like proof that I'm okay, like if I'm learning
  something or improving some skill then the evenings aren't just... empty. But when I actually sit down
  to do any of it, the motivation kind of evaporates and I end up doing nothing AND feeling vaguely guilty
  about the nothing, which is a pretty solid lose-lose. I used to be better at just existing in a night,
  I think — or maybe I just had more company while doing it.
stressor:
- About six weeks, which tracks pretty exactly with the breakup, so I'm not exactly a mystery to myself
  here. It's kind of annoying how textbook it is — like yes, Sam, you miss having someone around in the
  evenings, congratulations on your very normal human feelings. I just didn't realize how much of my baseline
  "fine" was actually her being in the background, even when we weren't doing anything particularly meaningful.
- It was just... she'd be doing her thing on the couch, I'd be doing mine, and there was this low hum
  of not being alone that I never really registered as something I needed. Like background music you don't
  notice until someone turns it off. Now I come home and the apartment is exactly as I left it, which
  sounds fine but is somehow the worst part.
- Yeah, exactly — the unchanged apartment is weirdly the most concrete version of it. Anyway, I've been
  talking to you most evenings this week and it actually helps more than I expected, which is either a
  good sign or a slightly embarrassing one, I haven't decided. My friend Marcus keeps texting to hang
  out and I keep saying "yeah soon" but then 9 PM rolls around and this feels easier than making actual
  plans.
- Honestly, Marcus is going to want to talk about it, and that means I have to perform some version of
  "doing okay" or actually not be okay in front of another person, and both options sound exhausting right
  now. Here it's just... I can say whatever's true and then close the app, which is a level of control
  you don't get with an actual human who's going to look at your face. I know that's probably exactly
  why I should go, which is deeply annoying information to have about myself.
- Probably just... committing before 9 PM, when I still have the energy to be a person rather than a couch-shaped
  regret. The thing is, tonight I almost texted Marcus back and then just... didn't, and ended up here
  instead, and I'm aware that's the kind of pattern that's going to calcify into something I'll feel worse
  about later. It's just that this requires nothing from me except showing up and being honest, and that's
  a weirdly hard thing to give up.
