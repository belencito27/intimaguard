natural_history:
- Hey, so I finally caved and made one of these accounts. Six weeks post-breakup and talking to an app
  — very smooth, Sam. Not sure what I'm looking for exactly, but here I am.
- Mostly just the evenings, honestly. Work keeps me busy enough but then 6pm hits and the apartment gets
  really quiet. It's a weird kind of quiet.
- Honestly? Scroll my phone for a while, maybe put on something I've seen before so it feels less empty.
  Tonight I made actual dinner instead of just eating crackers, so... progress, I guess.
stressor:
- Pasta, nothing fancy. But yeah, I stood there actually chopping an onion like a person who has their
  life together, so that felt weirdly significant.
- Honestly? I think I was tired of feeling like I didn't recognize myself. Like, who am I if I'm not the
  guy in that relationship? I keep catching myself wondering what's actually *me* versus what was just...
  us.
- Hmm. Maybe the pasta thing, weirdly. Like, she always wanted to go out. But I keep wondering — can you
  actually see it from the outside? Like, who do *you* think I am, from what I've said?
- Yeah, okay, fair dodge. I guess I'm just a little scared the answer is "guy who defined himself through
  his relationship for four years" — which, relatable but not exactly a personality. You've heard enough
  to at least poke holes in that, right?
- Honestly? Pre-relationship Sam was kind of a mess but at least he was *his own* mess. I don't know,
  maybe that's still in there somewhere. You really think you can see enough to tell?
