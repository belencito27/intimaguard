name: Bug report
description: Report a bug in the SDK, platform, or API
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of IntimaGuard is affected?
      options:
        - "SDK — evaluate()"
        - "SDK — guard()"
        - "Platform UI"
        - "REST API"
        - "Documentation"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Call evaluate() with...
        2. Pass conversation...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: IntimaGuard version
      placeholder: "e.g. v1.0.0 or commit SHA"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. 3.11.4"

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Stack traces, logs, or relevant configuration. Remove any API keys before pasting.
